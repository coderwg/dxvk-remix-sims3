# RTX Remix bridge configuration for The Sims 3 with the camera hook.
# Copy to Game\Bin\.trex\bridge.conf (both bridge halves read that file). Everything else stays at
# its default; the full option list with comments is bridge.conf in the repository root.
logLevel = Info
# The camera hook drives the runtime's sky brightness and its lights through the Remix API
# (milestones 20a/20b); the bridge server loads the runtime's API only with this on.
exposeRemixApi = True
