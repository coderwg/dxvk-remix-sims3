# RTX Remix runtime configuration for The Sims 3 with the camera hook.
# Copy to Game\Bin\rtx.conf. The runtime rewrites that file whenever settings are saved from
# the in-game Remix menu, adding every option it knows; this is the minimal set the hook needs.

# Ray tracing on. Triangle culling on (the game's culling is correct for its meshes).
rtx.enableRaytracing = True
rtx.enableCulling = True

# The game packs vertex normals into vertex colours: those colours are not baked lighting, and
# the hook's vertex shader variants write real normals for the runtime to capture.
rtx.ignoreAllVertexColorBakedLighting = True
rtx.useVertexCapturedNormals = True

# The scale: The Sims 3 counts in metres (a wall is 3 units high); the runtime takes a game unit for a
# centimetre unless told, and every option it gives in metres is converted with this.
rtx.sceneScale = 0.01

# The terrain baker. The hook tags every terrain draw with one of three fixed marker textures
# (their hashes are constant, so these lines work on any install): the terrain marker (visible
# base draws), the layer-pass marker and the paint-composite marker (hidden re-submissions).
# The cascade sizes are in metres, which at this scale are game units: 32 units for the first
# level, 8000 around the camera (the game's far plane, GraphicsRules.diff), 2000 of height.
rtx.terrainTextures = 0x85921E7690AE8F4E, 0xA6B69F6C017AC9DA, 0xE2ED852917B9DFF7
rtx.hideInstanceTextures = 0x85921E7690AE8F4E, 0xE2ED852917B9DFF7
# The game's terrain has no vertex normals (its shaders light it with a normal map), so the
# runtime would shade every triangle flat: it makes smooth normals for draws with the terrain marker.
rtx.smoothNormalsTextures = 0xA6B69F6C017AC9DA
rtx.terrainBaker.enableBaking = True
rtx.terrainBaker.clearTerrainBeforeBaking = True
rtx.terrainBaker.cascadeMap.useTerrainBBOX = False
rtx.terrainBaker.cascadeMap.levelResolution = 4096
rtx.terrainBaker.cascadeMap.levelHalfWidth = 32
rtx.terrainBaker.cascadeMap.maxLevels = 9
rtx.terrainBaker.cascadeMap.defaultHalfWidth = 8000
rtx.terrainBaker.cascadeMap.defaultHeight = 2000
rtx.terrainBaker.cascadeMap.expandLastCascade = True

# Interface textures (content hashes, valid for this game version): the runtime injects its
# ray-traced image at the first draw of a frame that binds one of these.
rtx.uiTextures = 0x005178BCA85A9358, 0x0FD7434A6F0C8F2C, 0x4A8371237900CD45, 0x87CE178AB95EA9B3, 0xA06E0898509EA5C4, 0xB21F6542113EC756, 0xBAE0D4569D1D43A2, 0xC8A07FB7623EA9AA, 0xCAFECC430B32D44B, 0xE02D03617A2395AB, 0xE920171AFCCA2726
# The build-mode grid, drawn in the world.
rtx.worldSpaceUiTextures = 0x9842B25662E1DBDF

# Scene captures as .usda (readable text).
rtx.captureInstanceStageName = capture_{timestamp}.usda

# The picture's brightness (2026-09-30, the user found day and night too bright on the runtime's defaults:
# local tone mapping exposure 0.75, shadow lift 2, auto-exposure range -2 .. +5 EV). Starting values, judged by eye.
rtx.localtonemap.exposure = 0.5
rtx.localtonemap.shadows = 1
rtx.autoExposure.evMinValue = -3
